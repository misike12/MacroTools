name: Release plugins

# Fully automatic: pushing a manifest version to master that has no complete
# release yet builds, packs and publishes it. Just bump "version" in one of
# src/<Plugin>/manifest.json and push. Tags are namespaced per plugin so
# independent versions never collide: Windows Media Control keeps the historic
# v<version> scheme, the others use <slug>-v<version>. Every step is resumable:
# a half-finished release (tag without assets, like v1.10.1 had) gets
# completed instead of duplicated.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

# Serialize releases: two pushes racing the same new version must not both
# cut it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        run: dotnet test --nologo

  release:
    name: Release ${{ matrix.slug }}
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - source: src/WindowsMediaControl
            slug: windows-media
            tagPrefix: ""
          - source: src/ScreenControl
            slug: screen-control
            tagPrefix: "screen-control-"
          - source: src/Timers
            slug: timers
            tagPrefix: "timers-"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install macrodeck-plugin CLI
        run: dotnet tool install --global MacroDeck.Plugin.Cli --prerelease

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Output "Shell: $($PSVersionTable.PSVersion)."
          $manifest = Get-Content -LiteralPath "${{ matrix.source }}/manifest.json" -Raw |
            ConvertFrom-Json
          $tag = "${{ matrix.tagPrefix }}v$($manifest.version)"
          $file = "$($manifest.id)-$($manifest.version).macroDeckPlugin"
          Write-Output "Expecting release $tag with asset $file."
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "file=$file" >> $env:GITHUB_OUTPUT
          "prerelease=$($manifest.version -match '-')" >> $env:GITHUB_OUTPUT
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
          }
          $complete = $false
          try {
            $release = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" `
              -Headers $headers -TimeoutSec 30 -UseBasicParsing
            $attached = @($release.assets | ForEach-Object { $_.name })
            $complete = $attached -contains $file
            Write-Output "Release $tag exists; expected asset attached: $complete."
          }
          catch {
            Write-Output "No release $tag yet: $($_.Exception.Message)"
            $complete = $false
          }
          "complete=$complete" >> $env:GITHUB_OUTPUT

      - name: Build plugin artifact
        if: steps.version.outputs.complete != 'true'
        run: macrodeck-plugin build --source ${{ matrix.source }} --output ./artifacts

      - name: Tag and release
        if: steps.version.outputs.complete != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $file = "${{ steps.version.outputs.file }}"
          $repo = "${{ github.repository }}"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
          }
          $remoteTag = git ls-remote --tags origin $tag
          if ([string]::IsNullOrWhiteSpace($remoteTag)) {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag $tag
            git push origin $tag
            Write-Output "Created tag $tag."
          }
          else {
            Write-Output "Tag $tag already exists, reusing it."
          }
          $release = $null
          try {
            $release = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" `
              -Headers $headers -TimeoutSec 30 -UseBasicParsing
            Write-Output "Release $($release.id) already exists."
          }
          catch {
            $payload = @{
              tag_name = $tag
              name = $tag
              generate_release_notes = $true
            }
            if ("${{ steps.version.outputs.prerelease }}" -eq "True") { $payload.prerelease = $true }
            $release = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/$repo/releases" `
              -Method Post -Headers $headers `
              -Body ($payload | ConvertTo-Json -Compress) `
              -ContentType "application/json"
            Write-Output "Created release $($release.id)."
          }
          $uploadBase = $release.upload_url -replace "\{\?name,label\}$", ""
          $attached = @($release.assets | ForEach-Object { $_.name })
          Get-ChildItem -LiteralPath "artifacts" -Filter $file | ForEach-Object {
            if ($attached -contains $_.Name) {
              Write-Output "$($_.Name) already attached, skipping."
              return
            }
            $uri = "${uploadBase}?name=$($_.Name)"
            $assetHeaders = @{
              Authorization = "Bearer $env:GH_TOKEN"
              "Content-Type" = "application/octet-stream"
            }
            $asset = Invoke-RestMethod -Uri $uri -Method Post -Headers $assetHeaders -InFile $_.FullName
            Write-Output "Uploaded $($asset.name) ($($asset.size) bytes)."
          }
