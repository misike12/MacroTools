name: Release plugin

# Fully automatic: pushing a manifest version to master that has no release
# yet builds, packs and publishes it. Just bump "version" in
# src/WindowsMediaControl/manifest.json and push - pushes without a version
# bump find the release already there and do nothing.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

# Serialize releases: two pushes racing the same new version must not both
# cut it. The loser sees the winner's release and skips.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install macrodeck-plugin CLI
        run: dotnet tool install --global MacroDeck.Plugin.Cli --prerelease

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Output "Shell: $($PSVersionTable.PSVersion) on $($PSVersionTable.OS)."
          $manifest = Get-Content -LiteralPath "src/WindowsMediaControl/manifest.json" -Raw |
            ConvertFrom-Json
          $tag = "v$($manifest.version)"
          Write-Output "Manifest version resolves to tag $tag."
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
          }
          $exists = $false
          try {
            $response = Invoke-WebRequest `
              -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" `
              -Headers $headers -TimeoutSec 30 -UseBasicParsing
            $exists = $response.StatusCode -eq 200
            Write-Output "Release lookup HTTP $($response.StatusCode)."
          }
          catch {
            Write-Output "Release lookup failed (treated as missing): $($_.Exception.Message)"
            $exists = $false
          }
          if ($exists) {
            Write-Output "Release $tag already exists, nothing to do."
            "released=true" >> $env:GITHUB_OUTPUT
          }
          else {
            Write-Output "No release $tag yet, will build and publish."
            "released=false" >> $env:GITHUB_OUTPUT
          }

      - name: Run tests
        run: dotnet test --nologo

      - name: Build plugin artifact
        if: steps.version.outputs.released == 'false'
        run: macrodeck-plugin build --source src/WindowsMediaControl --output ./artifacts

      - name: Tag and release
        if: steps.version.outputs.released == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $tag
          git push origin $tag
          $payload = @{
            tag_name = $tag
            name = $tag
            generate_release_notes = $true
          }
          if ($tag -match "-") { $payload.prerelease = $true }
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/$repo/releases" `
            -Method Post -Headers $headers `
            -Body ($payload | ConvertTo-Json -Compress) `
            -ContentType "application/json"
          Write-Output "Created release $($release.id)."
          $uploadBase = $release.upload_url -replace "\{\?name,label\}$", ""
          Get-ChildItem -LiteralPath "artifacts" -Filter "*.macroDeckPlugin" | ForEach-Object {
            $uri = "$uploadBase?name=$($_.Name)"
            $assetHeaders = @{
              Authorization = "Bearer $env:GH_TOKEN"
              "Content-Type" = "application/octet-stream"
            }
            $asset = Invoke-RestMethod -Uri $uri -Method Post -Headers $assetHeaders -InFile $_.FullName
            Write-Output "Uploaded $($asset.name) ($($asset.size) bytes)."
          }
